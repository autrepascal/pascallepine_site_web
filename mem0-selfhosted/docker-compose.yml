# OpenMemory (mem0 auto-hébergé) — stack LOCAL pour l'étape 3
#
# Objectif : valider que le pipeline mémoire tourne 100 % en local.
#   - Qdrant      : stockage vectoriel des mémoires (dans Docker)
#   - OpenMemory  : API REST + serveur MCP (pour brancher Claude)
#   - UI          : interface web pour visualiser/gérer les mémoires
#
# Le LLM et les embeddings tournent via OLLAMA NATIF sur ton Mac
# (pas dans Docker → accès GPU Metal). Le conteneur le joint via
# host.docker.internal. Rien ne sort de ta machine.
#
# Lancer :  docker compose up -d
# Arrêter : docker compose down
# Repartir de zéro (efface les mémoires) : docker compose down -v

services:
  mem0_store:
    image: qdrant/qdrant:latest
    container_name: openmemory-qdrant
    ports:
      - "6333:6333"
    volumes:
      - mem0_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  openmemory-mcp:
    image: mem0/openmemory-mcp:latest
    container_name: openmemory-mcp
    env_file: .env
    ports:
      - "8765:8765"
    depends_on:
      mem0_store:
        condition: service_started
    # Garantit que host.docker.internal pointe vers la machine hôte
    # (indispensable sur Linux, inoffensif sur Mac/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openmemory-ui:
    image: mem0/openmemory-ui:latest
    container_name: openmemory-ui
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_USER_ID=${NEXT_PUBLIC_USER_ID}
    ports:
      - "3000:3000"
    depends_on:
      - openmemory-mcp

  # Serveur MCP maison (étape 3b) : branche Claude sur la mémoire locale.
  # Reste en vie ; Claude lance le serveur via `docker exec -i`.
  mem0-mcp-server:
    build: ./mcp
    container_name: mem0-mcp-server
    depends_on:
      mem0_store:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sleep", "infinity"]

volumes:
  mem0_storage:
